<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Skillox</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=33.0">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* Custom Premium Auth UI Overrides */
        body { background: #f8fafc; }
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; z-index: 10; }
        .auth-card { background: white; border-radius: 28px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); width: 100%; max-width: 440px; border: 1px solid rgba(226, 232, 240, 0.8); }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .logo h2 { font-size: 2rem; color: #0f172a; margin: 10px 0; font-weight: 800; display:flex; flex-direction:column; align-items:center; }
        .logo-icon-svg { width: 52px; height: 52px; margin-bottom: 8px; color: #ea580c; }
        #auth-subtitle { color: #64748b; font-size: 0.95rem; margin-top: 5px; font-weight: 400; }

        .pill-input-group {
            display: flex;
            align-items: center;
            border: 1.5px solid #e2e8f0;
            border-radius: 50px;
            padding: 8px 20px;
            margin-bottom: 16px;
            transition: all 0.2s ease;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.01);
        }
        .pill-input-group:focus-within {
            border-color: #ea580c;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.1);
        }
        .pill-input-icon { color: #94a3b8; margin-right: 12px; display: flex; align-items: center; }
        .pill-input-content { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .pill-label { font-size: 0.75rem; font-weight: 600; color: #0f172a; margin-bottom: 2px; }
        .pill-input { border: none; outline: none; background: transparent; font-size: 0.95rem; color: #334155; width: 100%; padding: 0; }
        .pill-input::placeholder { color: #94a3b8; font-weight: 400; }
        .forgot-pwd-link { display: block; text-align: right; font-size: 0.85rem; color: #ea580c; font-weight: 500; margin-bottom: 24px; text-decoration: none; margin-top: -6px; }

        .btn-primary { border-radius: 50px; padding: 14px; font-size: 1.05rem; font-weight: 700; box-shadow: 0 4px 14px rgba(234,88,12,0.25); border: none; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(234,88,12,0.4); transform: translateY(-1px); }

        .social-divider { display: flex; align-items: center; text-align: center; margin: 30px 0; color: #0f172a; font-size: 0.9rem; }
        .social-divider::before, .social-divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .social-divider span { padding: 0 15px; }

        .social-btns { display: flex; gap: 12px; }
        .btn-social { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid #0f172a; border-radius: 50px; padding: 12px; background: white; color: #0f172a; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .btn-social:hover { background: #f1f5f9; }

        .auth-footer-links { text-align: center; margin-top: 30px; display: flex; justify-content: center; gap: 20px; }
        .auth-footer-links a { color: #94a3b8; font-size: 0.85rem; text-decoration: none; transition: 0.2s; }
        .auth-footer-links a:hover { color: #0f172a; }
        
        /* Hide glowing orbs for cleaner look */
        .bg-glow { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo" style="text-decoration: none;">
                    <h2>
                        <svg class="logo-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                        </svg>
                        SKILLOX
                    </h2>
                </a>
                <h1 style="font-size: 2.1rem; color: #0f172a; font-weight: 800; margin-bottom: 8px; font-family: 'Outfit', sans-serif;">Welcome Back</h1>
                <p id="auth-subtitle">Log in to continue your learning journey.</p>
            </div>

            <div class="auth-step active" id="step-login">
                <form id="login-form">
                    <div class="pill-input-group">
                        <div class="pill-input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </div>
                        <div class="pill-input-content">
                            <label for="login-email" class="pill-label">Email Address</label>
                            <input type="email" id="login-email" class="pill-input" placeholder="Enter your email" required>
                        </div>
                    </div>
                    
                    <div class="pill-input-group" style="margin-bottom: 8px;">
                        <div class="pill-input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
                        </div>
                        <div class="pill-input-content">
                            <label for="login-password" class="pill-label">Password</label>
                            <input type="password" id="login-password" class="pill-input" placeholder="Enter your password" required>
                        </div>
                        <button type="button" class="btn-eye toggle-password" tabindex="-1" style="background:none; border:none; color:#94a3b8; cursor:pointer; padding:0; display:flex;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-open">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-closed" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    
                    <a href="forgot-password.html" class="forgot-pwd-link">Forgot Password?</a>
                    
                    <button type="submit" class="btn btn-primary btn-block">Log In</button>
                </form>
                
                <p style="text-align: center; margin-top: 25px; color: #0f172a; font-size: 0.95rem;">
                    Don't have an account? <a href="signup.html" style="color: #ea580c; font-weight: 600; text-decoration: none;">Sign Up</a>
                </p>

                <div class="social-divider"><span>or log in with</span></div>

                <div class="social-btns">
                    <button class="btn-social" type="button" id="google-login-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                        Continue with Google
                    </button>
                </div>
                
                <div class="auth-footer-links">
                    <a href="#">Terms of Use</a>
                    <a href="#">Privacy Policy</a>
                </div>
            </div>

            <!-- Step 2: 2FA OTP Verification -->
            <div class="auth-step hidden" id="step-login-verify">
                <p style="text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem;">
                    Two-Factor Authentication is enabled on your account.<br>We sent a 6-digit code to <br><strong style="color: #ea580c;" id="verify-2fa-email">your email</strong>
                </p>
                <form id="login-otp-form">
                    <div class="otp-container">
                        <input type="text" class="otp-input" maxlength="1" autocomplete="off" required>
                        <input type="text" class="otp-input" maxlength="1" autocomplete="off" required>
                        <input type="text" class="otp-input" maxlength="1" autocomplete="off" required>
                        <input type="text" class="otp-input" maxlength="1" autocomplete="off" required>
                        <input type="text" class="otp-input" maxlength="1" autocomplete="off" required>
                        <input type="text" class="otp-input" maxlength="1" autocomplete="off" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 25px;">Verify Code & Log In</button>
                    <button type="button" class="btn btn-outline btn-block" id="btn-login-back" style="margin-top: 10px;">Cancel</button>
                </form>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js?v=33.0"></script>

    <!-- Mobile Bottom Navigation -->
    <div class="mobile-bottom-nav">
        <a href="index.html" class="bottom-nav-item" id="nav-home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Home</span>
        </a>
        <a href="textbooks.html" class="bottom-nav-item" id="nav-library">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span>Library</span>
        </a>
        <a href="bookmarks.html" class="bottom-nav-item" id="nav-saved">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            <span>Saved</span>
        </a>
        <a href="profile.html" class="bottom-nav-item" id="nav-profile">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profile</span>
        </a>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const path = window.location.pathname;
            const page = path.split("/").pop();
            if(page === "" || page === "index.html") document.getElementById("nav-home")?.classList.add("active");
            else if(["textbooks.html", "cbse.html", "icse.html", "up-board.html", "revision.html"].includes(page)) document.getElementById("nav-library")?.classList.add("active");
            else if(page === "bookmarks.html") document.getElementById("nav-saved")?.classList.add("active");
            else if(page === "profile.html" || page === "login.html" || page === "signup.html" || page === "admin.html") document.getElementById("nav-profile")?.classList.add("active");
        });
    </script>

</body>
</html>
